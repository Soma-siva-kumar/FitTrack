[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Proxy function calls cleanly
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Client-side routing: redirect all unmatched paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
